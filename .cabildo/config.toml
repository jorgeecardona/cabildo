# cabildo's own repo policy. Jorge works this repo trunk-based: commit on main,
# push directly to origin/main, no lanes / no merge requests. So cabildo's own
# guards, which assume the lane/daemon push flow, are turned off here.

[trunk]
# Allow committing directly on main — this repo is worked trunk-based.
mode = "off"

[push]
# No daemon push routing; a plain `git push origin main` is how work goes out.
mode = "manual"
