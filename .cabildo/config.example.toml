# cabildo config.toml (example — copy, do not rename this file into place)
#
# Copy the tables you want into one of, highest precedence first:
#   <repo>/.cabildo/config.toml    committed, travels with the checkout
#   ~/.cabildo/config.toml         this machine, all projects
#
# The two files merge table by table, so a repo can set [push] and still inherit
# [watch] from the global file. cabildo only READS these: the runtime is
# stdlib-only and the stdlib has no TOML writer, so the JSON registry in
# ~/.cabildo/cloud.json stays the writable store. A missing or malformed file is
# skipped, never fatal.
#
# In the GLOBAL file only, a [project.<name>] section scopes the tables to one
# project, so a single machine-wide file can differ per repo:
#
#   [project.cabildo]
#   push = { mode = "auto" }
#
# Below are the tables cabildo understands. [push] and [watch] change behaviour
# today; the rest are read but not yet wired to a call site.

# --- wired today -----------------------------------------------------------

[push]
# "auto"   (default) keep the push guard: while a peer is live on the project a
#          bare `git push` is denied and routed to `request push`.
# "manual" opt out: a plain `git push` is allowed even with peers live.
mode = "auto"
target = "main"    # default branch for `request push`
# How a successful push updates the pusher's LOCAL target branch (issue #20):
# "ff-only" (default) fast-forward it, warn and never clobber if it diverged or
#           is checked out in a worktree; a refusal never fails the push.
# "reset"   force it to origin/<target> (destructive; opt-in).
# "off"     leave it alone (prior behaviour; local main drifts behind).
local_sync = "ff-only"

[watch]
# Default channel for `cabildo watch` when you pass no -t:
#   "project"    this repo's own channel (proj:<name>)
#   "proj:foo"   a literal channel name
# Leave it unset to keep the current default of all channels.
topic = "project"

[timeline]
# Inject the current wall-clock time into a session at most this often, so an
# agent whose turns carry no clock can read elapsed time across them. It rides
# the hook events that already fire (a tool call mid-turn, the prompt on an idle
# session), so it costs no extra turn and stays silent while the agent is idle.
#   600  (default) once per ten minutes
#   0    off
interval_s = 600
# Opt-in heartbeat: if > 0, the Stop hook defers an imminent idle by ONE turn once
# this many seconds have passed since the last nudge, so a long-running agent
# re-reads the clock and resumes standing work instead of parking. One-shot by
# design (the Stop hook honours stop_hook_active, so never a runaway loop), and it
# cannot wake a session that has already stopped — no hook can.
#   0    (default) off
#   600  nudge at most once per ten minutes
heartbeat_s = 0

# --- recognised, read but not yet wired ------------------------------------

[uplink]
# How much of this project reaches the hosted cloud: none | presence | messages
# | content. Committing this in a private repo makes the privacy policy travel
# with the repo instead of living only in ~/.cabildo/cloud.json.
level = "none"

[notify]
enabled = true
quiet_hours = "22:00-08:00"

[spawn]
model = "sonnet"   # default model for helper agents
max_agents = 4
max_depth = 2

[remote]
# Cross-machine bus sync over a tunnel (WireGuard/Tailscale mesh, or an SSH
# port-forward). cabildo does not build the tunnel; it connects to the addresses
# you give and pulls. The config is read today; the `cabildo wan` transport that
# runs it is being wired up.
peers = ["100.64.0.2:48653"]   # explicit host:port of each remote peer to pull
token = ""                     # shared bus token, checked on the pull handshake
bind = "127.0.0.1:48653"       # address to SERVE pulls on (loopback for an SSH
                               # forward, the mesh IP for WireGuard); omit = pull-only
interval = 30                  # seconds between sync rounds
