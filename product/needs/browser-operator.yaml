who: browser-operator

needs:

  - id: BROWSER-1
    text: >
      When the operator wants to manage the browser that agents use, they can do all of it
      with one cabildo command, with no loose script in ~/.claude/bin and no hand edit of
      ~/.claude.json.
    sources:
      - kind: primary
        who: Jorge Cardona
        date: 2026-10-29
        quote: "so the cabildo browser tool is fully incorporated into cabildo please"
      - kind: assumption
        date: 2026-08-29
        locator: "docs/issues/29-08-2026-cabildo-browser-subcommand.md"
    proofs:
      - "test:tests/test_browser_cli.py::test_doctor_exits_0_for_a_good_entry"
      - "test:tests/test_browser_cli.py::test_status_lists_the_servers_found"
      - "test:tests/test_browser_cli.py::test_reap_dry_run_names_what_it_would_stop_and_stops_nothing"

  - id: BROWSER-2
    text: >
      When the operator runs `cabildo browser status`, they can see how many browser MCP
      servers and Chrome processes are alive, their age and memory, which config each runs,
      and whether the saved login (storage state) is empty or stale. It reads /proc and never
      uses `pkill -f`, because that pattern kills the shell that runs it.
    sources:
      - kind: assumption
        date: 2026-08-29
        locator: "docs/issues/29-08-2026-cabildo-browser-subcommand.md (22 servers, 2.2 GB measured)"
    proofs:
      - "test:tests/test_browser_fleet.py::test_a_server_owns_the_chrome_processes_under_it"
      - "test:tests/test_browser_fleet.py::test_a_shell_that_only_mentions_the_server_is_not_a_server"
      - "test:tests/test_browser_entry.py::test_storage_state_counts_and_age"

  - id: BROWSER-3
    text: >
      When the operator runs `cabildo browser reap`, they can stop the browser processes
      whose Claude session is gone, or all of them with a flag, and read how much memory was
      freed. It never stops the process that runs it.
    sources:
      - kind: assumption
        date: 2026-08-29
        locator: "docs/issues/29-08-2026-cabildo-browser-subcommand.md"
    proofs:
      - "test:tests/test_browser_fleet.py::test_reap_by_default_picks_only_what_lost_its_session"
      - "test:tests/test_browser_fleet.py::test_a_tree_holding_a_protected_pid_is_never_picked"
      - "test:tests/test_browser_fleet.py::test_stop_kills_what_ignores_term"

  - id: BROWSER-4
    text: >
      When the operator runs `cabildo browser login`, they can log into sites in a visible
      browser window, and the logins are saved to the storage-state file with mode 600 when
      the window closes. It uses the Python Playwright package, so cabildo needs no npm
      install for this step.
    sources:
      - kind: primary
        who: Jorge Cardona
        date: 2026-10-29
        quote: "aah, there is a python based playwright no? [...] can we add it to cabildo please"
      - kind: assumption
        date: 2026-08-29
        locator: "~/.claude/bin/cabildo-browser-login (the script this replaces)"
      - kind: secondary
        who: 'GitLab issue #49'
        date: '2026-11-07'
        locator: https://gitlab.com/cardona-oss/cabildo/-/work_items/49
        observed_at: '2026-11-07'
      - kind: secondary
        who: 'GitLab issue #25'
        date: '2026-10-03'
        locator: https://gitlab.com/cardona-oss/cabildo/-/work_items/25
        observed_at: '2026-11-07'
      - kind: secondary
        who: 'GitLab issue #21'
        date: '2026-09-27'
        locator: https://gitlab.com/cardona-oss/cabildo/-/work_items/21
        observed_at: '2026-11-07'
    proofs:
      - "test:tests/test_browser_login.py::test_write_state_is_mode_600_and_counts"
      - "test:tests/test_browser_login.py::test_collect_returns_the_last_state_read_before_the_browser_closed"
      - "test:tests/test_browser_login.py::test_free_profile_stops_that_browser_and_removes_the_locks"

  - id: BROWSER-5
    text: >
      When the operator runs `cabildo browser doctor`, they can see a failure if the
      `cabildo-browser` entry in ~/.claude.json lacks `--isolated`, carries a
      `--user-data-dir`, or carries `--headless`. The browser always runs with a visible
      window.
    sources:
      - kind: assumption
        date: 2026-10-24
        locator: "docs/issues/29-08-2026-cabildo-browser-subcommand.md (headed rule)"
    proofs:
      - "test:tests/test_browser_entry.py::test_missing_isolated_fails"
      - "test:tests/test_browser_entry.py::test_a_user_data_dir_fails"
      - "test:tests/test_browser_entry.py::test_headless_flag_fails"
      - "test:tests/test_browser_entry.py::test_a_headless_env_var_fails"
      - "test:tests/test_browser_cli.py::test_doctor_exits_1_when_the_entry_turns_headless_on"

  - id: BROWSER-6
    text: >
      When an agent starts a session, it can browse through a browser MCP server that cabildo
      ships, built on the Python Playwright package, instead of the npm `@playwright/mcp`
      server.
    sources:
      - kind: assumption
        who: claude
        date: 2026-10-29
        # note (no source field for reasoning yet, prodc#117): Read from "fully incorporated".
        # Not confirmed by Jorge. The Playwright MCP server exists only for Node today, so this
        # means writing a new MCP server.
    proofs:
      - "test:tests/test_browser_server.py::test_the_server_offers_the_browser_tools_and_nothing_headless"
      - "test:tests/test_browser_server.py::test_click_by_ref_uses_the_aria_ref_locator"
      - "test:tests/test_browser_server.py::test_serve_refuses_headless_and_a_profile_directory"
