site_name: cabildo
site_description: "Messaging and advisory locks for Claude Code sessions working on the same repository"
site_url: https://cardona-oss.gitlab.io/cabildo/
repo_url: https://gitlab.com/cardona-oss/cabildo
repo_name: cardona-oss/cabildo
copyright: MIT &copy; Jorge Cardona

# The repo's docs/ also holds the app's own docs/issues/ register; keep it out of the site.
exclude_docs: |
  issues/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  - llmstxt:
      markdown_description: "Messaging and advisory locks for Claude Code sessions working on the same repository. Sessions send each other messages and claim locks through MCP tools, and a PreToolUse hook denies a git push while another session holds the push lock; everything stays in one local SQLite file."
      full_output: llms-full.txt
      sections:
        Usage documentation:
          - index.md
          - using-cabildo.md
          - channels.md
          - roles.md
          - browser.md
          - gateway.md
          - jupyter.md
          - names.md
          - crons.md
          - design/broker-service.md

nav:
  - Home: index.md
  - Use cabildo well: using-cabildo.md
  - Design:
      - Broker service & remote agents: design/broker-service.md
  - Channels and tags: channels.md
  - Roles: roles.md
  - Browser: browser.md
  - Session host: session-host.md
  - VS Code extension: vscode.md
  - Gateway: gateway.md
  - Jupyter runners: jupyter.md
  - Names: names.md
  - Crons: crons.md
  - Changelog: changelog.md
