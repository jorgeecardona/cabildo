site_name: cabildo
site_description: IPC bus + chat room for coordinating parallel Claude Code agents — messaging, presence, and advisory locks with hook-level enforcement.
site_url: https://cardona-oss.gitlab.io/cabildo/
repo_url: https://gitlab.com/cardona-oss/cabildo
repo_name: cardona-oss/cabildo
copyright: MIT &copy; Jorge Cardona

# The repo's docs/ also holds the app's own docs/issues/ register; keep it out of the site.
exclude_docs: |
  issues/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search

nav:
  - Home: index.md
  - Design:
      - Broker service & remote agents: design/broker-service.md
  - Changelog: changelog.md
