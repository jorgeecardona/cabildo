[project]
name = "agent-chat"
version = "0.1.0"
description = "A shared IPC bus / chat room for coordinating parallel Claude Code agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-chat-mcp = "agent_chat.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_chat"]
