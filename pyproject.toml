[project]
name = "cabildo"
dynamic = ["version"]  # the single source of truth is __version__ in src/cabildo/__init__.py (see [tool.hatch.version])
description = "Messaging and advisory locks for Claude Code sessions working on the same repository"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jorge Cardona", email = "jorgeecardona@gmail.com" },
]
keywords = ["claude-code", "agents", "mcp", "ipc", "coordination", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    # Upper-bounded on purpose. Both servers import `mcp.server.fastmcp.FastMCP`, and mcp 2.0 moved
    # that to `mcp.server.mcpserver.MCPServer` — an unbounded declaration means a fresh install
    # resolves to a version where our own import does not exist, and the failure shows up as a
    # session whose MCP tools silently never appear. Relax this in the same commit that migrates
    # the imports, not before.
    "mcp>=1.2,<2",
    "zeroconf>=0.130,<1",
    # the session switcher (cabildo.workspace) uses private APIs of both: pinned
    "textual==8.2.8",
    "textual-tty==0.4.0",
    "playwright>=1.50,<2",
]

[project.optional-dependencies]
# docs are an *extra* (not a uv dependency-group) so external services can install them via pip
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-llmstxt>=0.5",
]

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/cabildo"
Repository = "https://gitlab.com/cardona-oss/cabildo"
Issues = "https://gitlab.com/cardona-oss/cabildo/-/issues"
Changelog = "https://gitlab.com/cardona-oss/cabildo/-/blob/main/CHANGELOG.md"
Documentation = "https://cardona-oss.gitlab.io/cabildo/"

[project.scripts]
cabildo = "cabildo.cli:main"
cabildo-mcp = "cabildo.mcp_server:main"
cabildo-hook = "cabildo.hooks.cli:main"
cabildo-codex-hook = "cabildo.codex_hooks:main"

[dependency-groups]
# musil is a dev-only model checker (dependency-free); the runtime stays stdlib-only.
# It needs Python >=3.12, so it is conditional; the model tests importorskip it,
# (cabildo itself needs 3.12+ since 0.1.176).
dev = [
    "ruff>=0.6",
    # [nodejs]: Node from a PyPI wheel. Without it pyright downloads Node from nodejs.org
    # on every fresh CI container, which can hang the typecheck step.
    "pyright[nodejs]>=1.1.390",
    "pytest>=8",
    "musil>=0.35; python_version >= '3.12'",
    "vulture>=2.11",
    # This repo keeps its own follow-ups in docs/issues/, which prodc owns (`prodc issue board`).
    # Dev-only on purpose: the package serves no register, so prodc must never reach
    # [project.dependencies] — `pip install cabildo` is the bus and nothing else.
    "prodc>=0.10.6,<0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# After the pre-commit hook auto-bumps __version__ in the package __init__, uv must treat the
# editable install as stale and reinstall it; without the __init__ key the next `make check`
# runs against the old version. (pyproject is already an implicit key; __init__ is the version source.)
cache-keys = [{ file = "pyproject.toml" }, { file = "src/cabildo/__init__.py" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version lives as __version__ in the package itself; hatchling reads it (by regex, no import) so
# pyproject and the runtime never disagree. scripts/bump-version rewrites that literal.
path = "src/cabildo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cabildo"]

# Ship the bundled Claude Code mod (push delivery, #30) inside the package so
# `cabildo plugin` finds it on any install — editable or a plain wheel in
# site-packages — not only from a repo checkout. It lands beside the package as
# cabildo/_bundled_mods/; `cabildo.mods.mods_dir()` looks there.
[tool.hatch.build.targets.wheel.force-include]
"mods" = "src/cabildo/_bundled_mods"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "mods", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = ["docs/issues"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Strict base: everything on, each opt-out justified. cabildo is a CLI + daemon app
# (prints, subprocess, hand-built SQL, argparse handlers), so it opts out of more of the
# library-oriented rules than the pure-library repos do.
select = ["ALL"]
ignore = [
    "E501",    # line length is the formatter's job (line-length = 100)
    "COM812",  # trailing commas conflict with `ruff format` (ruff's own recommendation)
    "ISC001",  # implicit string concat conflicts with the formatter
    "D1",      # not every helper owes a docstring; the ones that exist explain *why*
    "D203", "D205", "D212", "D213", "D400", "D401", "D404", "D415",
               # docstrings here are narrative rationale, not pydocstyle-shaped summaries
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN206", "ANN401",
               # argparse handlers take an untyped Namespace; annotating every one adds noise
    "T20",     # this is a CLI: print() is the interface, not a debugging leftover
    "PLC0415", # local imports are load-bearing — they defer work past import/collection time
    "TRY003", "EM101", "EM102",  # inline exception messages; msg-variable style adds noise
    "TRY300", "TRY301",          # else-after-return / abstract-raise churn without payoff
    "BLE001",  # best-effort teardown/reap/notify paths catch Exception on purpose
    "PLW0603", # a few module-level caches are updated via `global` by design
    "PLR2004", # literal thresholds (windows, limits) read clearer inline than as constants
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # branch/arg/return counts not gated here
    "C901",    # cyclomatic-complexity not gated here
    "FBT001", "FBT002", "FBT003",  # bool flags are the CLI's own surface
    "SLF001",  # cabildo reaches into its own sqlite3.Row / private helpers deliberately
    "PTH",     # os.path is used throughout; migrating to pathlib is a separate change
    "S603", "S607",  # subprocess with controlled, non-shell argv (git/claude/systemctl)
    "S608",    # SQL is built from constant fragments, never user input
    "PLW1510", # subprocess.run without check= is intentional in best-effort probes
    "PERF203", # try/except in a loop is fine for per-item best-effort work
    "RUF001", "RUF002", "RUF003", "RUF005", "RUF059",  # unicode look-alikes in human text; minor collection nits
    "TD002", "TD003", "FIX002",    # TODO authorship/link bookkeeping is not enforced
    "G004",    # f-strings in logging calls are fine at this scale
    "PLC0206", # dict-iteration style nit
    "CPY001",  # no per-file copyright header
    "TC001", "TC002", "TC003",  # runtime imports kept plain, not shuffled into TYPE_CHECKING
    "PERF401", # manual list-building reads fine; not every loop must be a comprehension
    "SIM102", "SIM105", "SIM115",  # nested-if / contextlib.suppress / open-context nits
    "S110", "S112",  # try/except pass|continue is deliberate in best-effort loops
    "PLW2901", # reusing a loop variable name is intentional in a couple of spots
    "DTZ005", "DTZ006", "DTZ011",  # naive local datetimes are intentional in a local-only tool
    "ERA001",  # some comments legitimately look like commented-out code
    "ISC004",  # implicit concat in collections; readability nit
    "PIE810",  # multiple startswith/endswith calls, not worth tupling
    "UP031",   # a few %-format strings remain; harmless
    "ARG001", "ARG002",  # callback/hook signatures carry params they don't all use
    "A002",    # a handler mirrors a stdlib signature that shadows a builtin (BaseHTTPRequestHandler)
    "E731",    # a couple of small lambda assignments read fine
    "E402",    # one deliberate post-guard import
    "B006",    # a couple of mutable defaults, used read-only (worth revisiting)
    "PLR1714", # chained == vs `in`, cosmetic
    "PLR0917", # positional-arg count, not gated (see PLR0913)
    "S310",    # urllib opens are constant http(s) endpoints, never user schemes
    "TRY004",  # ValueError vs TypeError choice left as written
    "N818",    # an exception class not suffixed Error
    "FURB162", # fromisoformat + .replace("Z") micro-nit
    "D210",    # docstring surrounding-whitespace nit
    "RET504",  # an explicit assign-before-return kept for clarity
    "EXE001",  # hook modules carry a shebang but run via the cabildo-hook entry point
]

[tool.ruff.lint.per-file-ignores]
# moved in from sessionmux as-is; drop these while integrating it
"src/cabildo/workspace/*" = ["RUF012", "S606"]
"tests/workspace/*" = ["ASYNC109", "PLW0108", "N802", "S103"]
"tests/*" = [
    "S101",    # asserts are the point of tests
    "PLR2004", # literal expectations in asserts are clearer than named constants
    "ARG",     # pytest hook/fixture signatures are fixed; params can go unused
    "ANN",     # test functions do not need annotations
    "INP001",  # tests/ is not an importable package namespace
    "PT",      # pytest-style nits (composite asserts, raises breadth, param types)
    "SLF001",  # tests reach into internals to set up / assert state
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["cabildo"]

[tool.pyright]
include = ["src", "tests"]
# ported sessionmux tests: 29 Optional-access errors; drop this while integrating them
ignore = ["tests/workspace"]
extraPaths = ["src"]
pythonVersion = "3.12"
# `standard` is the strictest mode cabildo is clean under: it leans on sqlite3.Row dynamic
# access and untyped argparse Namespaces throughout, which `strict` would flag by the
# hundred without catching real bugs. Tighten toward strict as modules gain annotations.
typeCheckingMode = "standard"
reportPrivateUsage = false
venvPath = "."
venv = ".venv"

[tool.vulture]
# Dead-code candidates (`make deadcode`). Not a CI gate: vulture cannot see
# dynamic dispatch, so it reports candidates for a human to confirm, not errors.
# Scans src only — scanning tests drowns the signal in pytest fixture params
# (used for their side effect, never referenced). The cost is that a src symbol
# used ONLY from a test can show up here; confirm against `grep` in tests/ before
# deleting anything.
paths = ["src/cabildo"]
min_confidence = 60
# Entry points reached by name/registry, never by a direct call vulture can see:
ignore_decorators = ["@mcp.tool", "@op"]
# Framework callbacks (http.server handler) and a sqlite hook attribute.
ignore_names = ["do_GET", "do_POST", "do_HEAD", "log_message", "row_factory"]
sort_by_size = true
